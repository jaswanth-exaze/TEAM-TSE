<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo Morph — T · S · E</title>
<style>
:root{--bg:#f6f9fc;--bg2:#e4eef7;--mut:#a9b7c6;--on:#2d7fc1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--bg2:#162636;--mut:#4a5b6d;--on:#7fcf5a}}
:root[data-theme="dark"]{--bg:#0e1621;--bg2:#162636;--mut:#4a5b6d;--on:#7fcf5a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 42%,var(--bg2),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
svg{width:min(78vw,62vh);height:auto;max-width:100%;cursor:pointer;overflow:visible}
#cap{display:flex;gap:28px;font-size:clamp(20px,4vw,30px);font-weight:700;letter-spacing:.2em;color:var(--mut)}
#cap span{transition:color .35s,transform .35s;display:inline-block}
#cap span.on{color:var(--on);transform:translateY(-4px) scale(1.25)}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 625 720" aria-label="Logo morphing into T, S, E and back">
<defs>
<linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="360" y1="20" x2="40" y2="480"><stop offset="0" stop-color="#5BB5E8"/><stop offset=".45" stop-color="#2F7CC0"/><stop offset="1" stop-color="#2F4DA0"/></linearGradient>
<linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="520" y1="240" x2="250" y2="660"><stop offset="0" stop-color="#EDEC80"/><stop offset=".4" stop-color="#5DB846"/><stop offset="1" stop-color="#235F33"/></linearGradient>
<clipPath id="db"><polygon points="410,-300 1400,-300 1400,1400 -300,1400 -300,410"/></clipPath>
<clipPath id="dg"><polygon points="700,-300 1400,-300 1400,1400 -300,1400 -300,700"/></clipPath>
<clipPath id="lb"><polygon points="-300,-300 410,-300 -300,410"/></clipPath>
<clipPath id="lg"><polygon points="-300,-300 700,-300 -300,700"/></clipPath>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1b3b6b" flood-opacity=".3"/></filter>
</defs>
<g id="root"><g filter="url(#sh)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path id="b" stroke="url(#gb)"/><path id="g" stroke="url(#gg)"/><path id="m" stroke="url(#gg)"/>
<g clip-path="url(#db)"><path id="b2" stroke="#06143a" stroke-opacity=".16"/></g>
<g clip-path="url(#dg)"><path id="g2" stroke="#031a0a" stroke-opacity=".2"/><path id="m2" stroke="#031a0a" stroke-opacity=".2"/></g>
<g clip-path="url(#lb)"><path id="b3" stroke="#fff" stroke-opacity=".14"/></g>
<g clip-path="url(#lg)"><path id="g3" stroke="#fff" stroke-opacity=".16"/><path id="m3" stroke="#fff" stroke-opacity=".16"/></g>
</g></g>
</svg>
<div id="cap"><span>T</span><span>S</span><span>E</span></div>
<script>
const L=(a,b,c,d)=>[a+(c-a)/3,b+(d-b)/3,a+2*(c-a)/3,b+2*(d-b)/3,c,d];
const mid=(a,b)=>(a+b)/2;
function split(x,y,s){const[a1,a2,b1,b2,x1,y1]=s;const A=[mid(x,a1),mid(y,a2)],B=[mid(a1,b1),mid(a2,b2)],C=[mid(b1,x1),mid(b2,y1)],D=[mid(A[0],B[0]),mid(A[1],B[1])],E=[mid(B[0],C[0]),mid(B[1],C[1])],F=[mid(D[0],E[0]),mid(D[1],E[1])];return[[...A,...D,...F],[...E,...C,x1,y1]];}
function four(p){let x=p[0],y=p[1],o=[x,y];for(let i=2;i<p.length;i+=6){const s=p.slice(i,i+6),[A,B]=split(x,y,s);o.push(...A,...B);x=s[4];y=s[5];}return o;}
const sh=(p,dx)=>p.map((v,i)=>i%2?v:v+dx);
const dot=[165,355,165,355,165,355,165,355];
const S={
logo:{b:[325,75,250,150,170,230,95,305,55,345,45,400,70,480],
 g:[445,285,385,345,300,420,255,465,195,525,215,620,300,655,360,675,410,650,450,610,490,570,520,530,550,490],m:dot,w:[118,132,0],cr:1},
T:{b:[130,150,...L(130,150,312,150),...L(312,150,495,150)],
 g:[312,215,...L(312,215,312,310),...L(312,310,312,405),...L(312,405,312,500),...L(312,500,312,595)],m:dot,w:[96,96,0],cr:0},
S:{b:sh([440,170,395,92,175,92,160,222,152,305,250,322,300,352],14),
 g:sh(four([300,352,385,385,465,418,450,508,432,610,200,622,140,545]),14),m:dot,w:[88,88,0],cr:0},
E:{b:[140,150,...L(140,150,305,150),...L(305,150,470,150)],
 g:[165,225,...L(165,225,165,355),...L(165,355,165,490),165,535,190,560,235,560,...L(235,560,470,560)],
 m:[165,355,...L(165,355,425,355)],w:[92,92,92],cr:0}
};
const dd=a=>{let s=`M${a[0]} ${a[1]}`;for(let i=2;i<a.length;i+=6)s+=`C${a.slice(i,i+6).join(' ')}`;return s;};
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const ease=t=>t*t*t*(t*(6*t-15)+10);
const cl=t=>Math.min(1,Math.max(0,t));
const el=id=>document.getElementById(id);
const spans=[...document.querySelectorAll('#cap span')];
function put(ids,path,w){ids.forEach(id=>{el(id).setAttribute('d',dd(path));el(id).setAttribute('stroke-width',Math.max(w,0));});}
function draw(A,B,u,dir){
  const kb=ease(cl(u*1.12)),kg=ease(cl((u-.1)*1.12)),km=ease(cl((u-.2)*1.25));
  put(['b','b2','b3'],lerp(A.b,B.b,kb),A.w[0]+(B.w[0]-A.w[0])*kb);
  put(['g','g2','g3'],lerp(A.g,B.g,kg),A.w[1]+(B.w[1]-A.w[1])*kg);
  put(['m','m2','m3'],lerp(A.m,B.m,km),A.w[2]+(B.w[2]-A.w[2])*km);
  const p=Math.sin(Math.PI*u);
  el('root').setAttribute('transform',`translate(312 360) rotate(${(dir*3*p*p).toFixed(2)}) scale(${(1+.035*p).toFixed(3)}) translate(-312 -360)`);
}
const order=['logo','T','S','E','logo'],HOLD=550,MOVE=1000,STEP=HOLD+MOVE,TOTAL=STEP*4+HOLD;
let t0=performance.now();
function frame(ts){
  const t=((ts-t0)%TOTAL+TOTAL)%TOTAL,i=Math.min(Math.floor(t/STEP),3),r=t-i*STEP,A=S[order[i]],B=S[order[i+1]];
  const u=r<HOLD?0:(r-HOLD)/MOVE;
  draw(A,B,u,i%2?-1:1);
  const act=u>.45?i:i-1;spans.forEach((s,k)=>s.classList.toggle('on',k===(u>.45?i:i-1)));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
el('s').addEventListener('click',()=>{t0=performance.now();});
</script>
</body>
</html>
