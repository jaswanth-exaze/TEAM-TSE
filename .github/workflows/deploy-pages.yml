name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install project dependencies
        run: npm ci

      - name: Check dependency security advisories
        run: npm audit --audit-level=high

      - name: Build the complete site
        run: npm run build

      - name: Verify built site
        run: |
          test -f dist/index.html
          test -f dist/about.html
          test -f dist/team.html
          test -f dist/css/style.css
          test -f dist/js/main.js
          test -f dist/js/logo-morph.js
          test -f "dist/exaze-logo (1).png"
          test -f dist/team/members/index.json
          test -f dist/.nojekyll
          test -f dist/courses/index.html
          test -d dist/courses/assets
          test -f dist/courses/sql-visual-lab/index.html
          test -f dist/courses/sql-visual-lab/app.js
          test -f dist/courses/sql-visual-lab/engine.js
          test -f dist/courses/sql-visual-lab/worker.js
          test -f dist/courses/sql-visual-lab/vendor/sql-wasm.js
          test -f dist/courses/sql-visual-lab/vendor/sql-wasm.wasm
          test -f dist/courses/sql-visual-lab/vendor/mysql.umd.js
          test -f dist/courses/sql-visual-lab/schema.sql
          test -f dist/courses/sql-visual-lab/challenges.json
          test -f dist/courses/linux-lab/index.html
          test -f dist/courses/linux-lab/lab.html
          test -f dist/courses/linux-lab/css/styles.css
          test -f dist/courses/linux-lab/js/app.js
          test -f dist/courses/linux-lab/js/terminal.js
          test -f dist/courses/linux-lab/js/validator.js
          test -f dist/courses/linux-lab/data/questions.json
          grep -Eq '<script[^>]+src="../courses/assets/[^"]+\.js"' dist/courses/index.html
          grep -Eq '<link[^>]+href="../courses/assets/[^"]+\.css"' dist/courses/index.html
          if grep -q 'src/main.jsx' dist/courses/index.html; then
            echo "Course output still references the uncompiled JSX entry point."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

